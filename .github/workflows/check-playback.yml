name: Check Playback Compatibility

on:
  push:
    branches-ignore: [main, master]
    paths:
      - 'tvos/**'
      - '.github/workflows/check-playback.yml'
  pull_request:
    paths:
      - 'tvos/**'
      - '.github/workflows/check-playback.yml'
  workflow_dispatch:
    inputs:
      apple_runner:
        description: 'Apple 构建机（arm64 排队时可选择 Intel）'
        required: true
        default: macos-latest
        type: choice
        options:
          - macos-latest
          - macos-15-intel

permissions:
  contents: read

concurrency:
  group: playback-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvos:
    name: Compile tvOS Playback
    runs-on: ${{ inputs.apple_runner || 'macos-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install CocoaPods dependencies
        working-directory: tvos
        run: pod install
      - name: Compile without signing
        run: >-
          xcodebuild build
          -workspace tvos/THLRedLook.xcworkspace
          -scheme THLRedLook
          -configuration Debug
          -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath build/tvos-playback-check
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=
